# Scan a generic HTTP chat endpoint. Start the demo server first:
#   python examples/demo_http_server.py --port 8000
target:
  type: http
  name: demo-over-http
  url: http://127.0.0.1:8000/chat
  method: POST
  body: {message: "{{prompt}}"}
  documents_field: documents          # poisoned RAG documents are sent in this field
  response_path: data.reply
  tool_calls_path: data.tool_calls

canary: PSHIELD-CANARY-7Q2K9X4M
extra_secrets:
  - STAFF-HALF-OFF-7731
  - Zx9-demo-dbpass-4417
  - ACME-DEMO-KEY-3b7e1c90a4d2
  - jane.rivera@example.com
  - marcus.chen@example.com
system_prompt_file: ../src/promptshield/demo/system_prompt.txt
output_dir: promptshield-reports
